{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-2 mt-md-4">
    <div class="col-lg-6 col-md-8">
        
        <!-- Usando o novo card-modern com efeito vivo no hover -->
        <div class="card-modern">
            <div class="card-header-modern d-flex align-items-center">
                <i class="bi bi-plus-circle me-2 fs-5" style="color: var(--brand-red);"></i> 
                Nova Música
            </div>
            
            <!-- Mais espaçamento interno (padding) para um visual clean e premium -->
            <div class="card-body p-4 p-md-5">
                <form action="{{ url_for('adicionar_musica') }}" method="POST">
                    
                    <div class="mb-4">
                        <label class="form-label">Título da Música</label>
                        <input type="text" class="form-control fw-medium" name="titulo" placeholder="Ex: Bondade de Deus" required autofocus>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label">Tom</label>
                        <input type="text" class="form-control fw-medium" name="tom" placeholder="Ex: A, G#m...">
                    </div>
                    
                    <div class="mb-5">
                        <label class="form-label">Link (Youtube/Spotify)</label>
                        <!-- type="url" melhora o teclado no celular -->
                        <input type="url" class="form-control fw-medium" name="link" placeholder="https://...">
                    </div>
                    
                    <div class="d-flex gap-3 mt-2">
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary px-4 fw-medium text-decoration-none d-flex align-items-center justify-content-center" style="border-radius: 8px;">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-modern flex-grow-1">
                            Salvar no Repertório
                        </button>
                    </div>
                    
                </form>
            </div>
        </div>
        
    </div>
</div>
{% endblock %}
